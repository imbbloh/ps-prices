<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayStation Store — Regional Price Finder</title>
<style>
  :root{--bg:#0b0f1a;--panel:#141a2b;--panel2:#1b2338;--line:#26304d;--txt:#e8ecf6;--dim:#94a0bd;--accent:#5b8cff;--accent2:#7c5cff;--good:#27d17c;--warn:#ffb454}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 60px}
  header{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:18px;padding:20px 18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(91,140,255,.25)}
  header h1{margin:0 0 4px;font-size:1.3rem}
  header p{margin:0;font-size:.85rem;opacity:.92}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:6px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:12px;font-size:1rem;outline:none}
  input[type=text]{flex:1 1 200px;min-width:0}
  input:focus{border-color:var(--accent)}
  button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;cursor:pointer;padding:12px 18px;border-radius:12px;font-size:1rem;font-weight:600}
  button:disabled{opacity:.55;cursor:progress}
  .settings{font-size:.78rem;color:var(--accent);cursor:pointer;margin-top:10px;display:inline-block}
  .setbox{display:none;margin-top:10px}
  .setbox.open{display:block}
  .status{font-size:.85rem;color:var(--dim);margin:12px 2px;min-height:1.2em}
  .status .warm{color:var(--warn)}
  .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.22);border-top-color:var(--accent);border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:8px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{height:3px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:0 2px;display:none}
  .bar.on{display:block}
  .bar i{display:block;height:100%;width:28%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:slide 1.5s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(460%)}}
  @media (prefers-reduced-motion:reduce){.spinner,.bar i{animation:none}}
  .sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .tile{flex:1 1 150px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .tile .k{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .tile .v{font-size:1.1rem;font-weight:700;margin-top:2px}
  .tile .v.good{color:var(--good)}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:.92rem}
  th{color:var(--dim);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.6px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.best td{background:linear-gradient(90deg,rgba(39,209,124,.14),transparent)}
  .fi{width:20px;height:15px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-right:8px;background:var(--panel2)}
  .reg{white-space:nowrap}
  .badge{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px}
  .badge.best{background:var(--good);color:#04220f}
  .badge.warn{background:var(--warn);color:#3a2600}
  .badge.info{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
  .badge.en{background:rgba(39,209,124,.16);color:var(--good);border:1px solid rgba(39,209,124,.4)}
  .badge.noen{background:var(--warn);color:#3a2600}
  a.store{color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim)}
  a.store:hover,a.store:focus-visible{color:var(--accent);border-bottom-color:var(--accent)}
  .was{display:block;color:var(--dim);font-size:.78em;text-decoration:line-through;margin-top:1px}
  .sugwrap{position:relative;flex:1 1 200px;min-width:0;display:flex}
  .sug{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:var(--panel2);
       border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;
       box-shadow:0 12px 28px rgba(0,0,0,.45);max-height:300px;overflow-y:auto}
  .sug.on{display:block}
  .sug div{padding:10px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sug div:hover,.sug div.sel{background:rgba(91,140,255,.18)}
  .sug .yr{color:var(--dim);font-size:.78em;margin-left:6px}
  .rank{color:var(--dim);width:1.5em;display:inline-block}
  .conv{font-weight:700}
  .foot{font-size:.72rem;color:var(--dim);margin-top:16px;line-height:1.6}
  .foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 PS Store — Regional Price Finder</h1>
  </header>

  <div class="card">
    <label for="game">Game title or store URL</label>
    <div class="row">
      <span class="sugwrap">
        <input id="game" type="text" placeholder="e.g. 007 First Light — or paste a store URL" autocomplete="off">
        <div class="sug" id="sug"></div>
      </span>
      <select id="cur" title="Display currency">
        <option value="SGD" selected>SGD</option>
        <option value="USD">USD</option>
        <option value="MYR">MYR</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="AUD">AUD</option>
        <option value="INR">INR</option>
      </select>
      <button id="go">Find prices</button>
    </div>
    <div class="settings" id="setToggle">▸ Backend settings</div>
    <div class="setbox" id="setBox">
      <label for="backend" style="margin-top:8px">Backend URL</label>
      <input id="backend" type="text" style="width:100%" placeholder="https://your-service.onrender.com" autocomplete="off">
      <div class="foot" style="margin-top:6px">Saved in this browser.</div>
    </div>
  </div>

  <div class="status" id="status">Ready.</div>
  <div class="bar" id="bar"><i></i></div>

  <div class="card" id="resultCard" style="display:none">
    <div class="sum" id="summary"></div>
    <table>
      <thead><tr><th>#</th><th>Region</th><th class="num">Local price</th><th class="num" id="convHead">≈ SGD</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="foot" id="note"></div>
  </div>

  <div class="foot">
    <div>Buying another region's price needs a PSN account set to that region and its gift-card credit.</div>
    <div style="margin-top:6px">Missing regions? Paste the game's store URL instead of a title.</div>
    <div id="fxline" style="margin-top:8px"></div>
  </div>
</div>

<script>
// Emoji flags are unusable here: Chrome on Windows ships no flag glyphs, so
// they render as bare letters or tofu. Use real images instead, with the region
// code as alt text so a blocked or failed image still identifies the row.
const REGION_NAME={US:'United States',UA:'Ukraine',IN:'India',JP:'Japan',BR:'Brazil',TR:'Türkiye',ID:'Indonesia',MY:'Malaysia',TW:'Taiwan',HK:'Hong Kong',KR:'South Korea',ZA:'South Africa',PL:'Poland',NO:'Norway',CA:'Canada',AU:'Australia',MX:'Mexico',GB:'United Kingdom',DE:'Germany',SG:'Singapore'};
const FLAG_SRC=r=>'https://flagcdn.com/w40/'+r.toLowerCase()+'.png';
const flag=r=>'<img class="fi" src="'+FLAG_SRC(r)+'" alt="'+r+'" width="20" height="15" loading="lazy" referrerpolicy="no-referrer">';
const $=id=>document.getElementById(id);
const store={ get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

const DEFAULT_BACKEND='https://ps-prices-api.onrender.com';
const FX_URL='https://open.er-api.com/v6/latest/USD';
const FX_TTL=6*60*60*1000;   // reuse cached rates for 6h
const HARD_TIMEOUT=120000;   // give up on a request after 2 min

$('backend').value = store.get('ps_backend') || DEFAULT_BACKEND;
$('setToggle').onclick=()=>$('setBox').classList.toggle('open');
$('backend').addEventListener('change',()=>store.set('ps_backend',$('backend').value.trim()));

// restore last search so a reload doesn't lose the user's place
$('game').value = store.get('ps_title') || '';
const lastCur = store.get('ps_cur'); if(lastCur) $('cur').value = lastCur;
$('cur').addEventListener('change',()=>store.set('ps_cur',$('cur').value));

const backendUrl=()=>($('backend').value||store.get('ps_backend')||DEFAULT_BACKEND).trim().replace(/\/$/,'');

const label=r=>flag(r)+' '+r;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Link a price to the store page it came from. Only http(s) URLs from the
// backend are linked, so a bad value degrades to plain text rather than markup.
function priceCell(x){
  const was=x.was?'<s class="was">'+x.was+'</s>':'';
  if(!x.url||!/^https:\/\/store\.playstation\.com\//.test(x.url)) return x.local+was;
  return '<a class="store" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer" title="Open the '+esc(x.r)+' store page">'+x.local+'</a>'+was;
}
function fmt(cur,val){ try{return new Intl.NumberFormat(undefined,{style:'currency',currency:cur,maximumFractionDigits:2}).format(val);}catch(e){return val.toLocaleString()+' '+cur;} }

// --- status helpers -------------------------------------------------------
let timers=[];
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function setStatus(html,busy){ $('status').innerHTML=(busy?'<span class="spinner"></span>':'')+html; }
function busy(on){ $('bar').classList.toggle('on',on); $('go').disabled=on; }

// Nudge the free-tier backend awake as soon as the page opens, so by the time
// the user has typed a title the ~30-45s cold start is usually already spent.
(function warmUp(){
  const b=backendUrl(); if(!b) return;
  fetch(b+'/health',{cache:'no-store'}).catch(()=>{});
})();

// ---- game catalogue -------------------------------------------------------
// catalog.json sits next to this page (GitHub Pages serves the repo root), so
// suggestions are local and instant — no backend call, no cold start. Absent
// file just means no suggestions; typing a title still works as before.
let CAT=null, CATKEY=null;
// Must match keyName() in server.js exactly, or a suggestion the user picks
// would not resolve the same way server-side. Apostrophes are dropped so
// "Marvels Spider-Man" matches "Marvel's Spider-Man".
const keyName=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/['\u2019`]/g,'').replace(/[^a-z0-9]+/g,' ').trim();

async function loadCatalog(){
  if(CAT) return CAT;
  try{
    const c=JSON.parse(store.get('ps_cat')||'null');
    if(c&&c.rows&&Date.now()-c.ts<24*60*60*1000){ CAT=c.rows; }
  }catch(e){}
  if(!CAT){
    try{
      const r=await fetch('catalog.json',{cache:'no-cache'});
      if(!r.ok) throw new Error('no catalogue');
      CAT=await r.json();
      try{ store.set('ps_cat',JSON.stringify({ts:Date.now(),rows:CAT})); }catch(e){}
    }catch(e){ CAT=[]; }
  }
  CATKEY=CAT.map(r=>({k:keyName(r.name),n:r.name,id:r.conceptId,y:(r.releaseDate||'').slice(0,4)}));
  return CAT;
}

// Prefix matches rank above substring matches, then shorter names first so
// "Gran Turismo 7" beats "Gran Turismo 7 Deluxe Edition Bundle".
function suggest(q,limit=8){
  if(!CATKEY||!q) return [];
  const k=keyName(q); if(k.length<2) return [];
  const pre=[],sub=[];
  for(const r of CATKEY){
    if(r.k.startsWith(k)) pre.push(r);
    else if(r.k.includes(k)) sub.push(r);
    if(pre.length>=limit*3) break;
  }
  const by=(a,b)=>a.n.length-b.n.length;
  return [...pre.sort(by),...sub.sort(by)].slice(0,limit);
}

let sugItems=[],sugIdx=-1;
function showSug(items){
  sugItems=items; sugIdx=-1;
  if(!items.length) return $('sug').classList.remove('on');
  $('sug').innerHTML=items.map((r,i)=>'<div data-i="'+i+'">'+esc(r.n)+(r.y?'<span class="yr">'+esc(r.y)+'</span>':'')+'</div>').join('');
  $('sug').classList.add('on');
}
function hideSug(){ $('sug').classList.remove('on'); sugItems=[]; sugIdx=-1; }
function pick(i){
  const r=sugItems[i]; if(!r) return;
  $('game').value=r.n;
  $('game').dataset.conceptId=r.id;   // exact id: the backend skips searching
  hideSug(); run();
}

$('game').addEventListener('input',async()=>{
  delete $('game').dataset.conceptId;   // typing invalidates a previous pick
  await loadCatalog();
  showSug(suggest($('game').value));
});
$('game').addEventListener('blur',()=>setTimeout(hideSug,150));
$('sug').addEventListener('mousedown',e=>{
  const d=e.target.closest('div[data-i]'); if(d){ e.preventDefault(); pick(+d.dataset.i); }
});

// FX with a localStorage cache, so a flaky rates API can't break the page.
async function getFx(){
  let cached=null;
  try{ cached=JSON.parse(store.get('ps_fx')||'null'); }catch(e){}
  if(cached&&cached.rates&&Date.now()-cached.ts<FX_TTL) return {rates:cached.rates,ts:cached.ts,stale:false};
  try{
    const j=await (await fetch(FX_URL)).json();
    if(!j||!j.rates) throw new Error('bad payload');
    store.set('ps_fx',JSON.stringify({ts:Date.now(),rates:j.rates}));
    return {rates:j.rates,ts:Date.now(),stale:false};
  }catch(e){
    if(cached&&cached.rates) return {rates:cached.rates,ts:cached.ts,stale:true};
    return {rates:null,ts:null,stale:false};
  }
}

async function run(){
  hideSug();
  const picked=$('game').dataset.conceptId;
  const title=picked||$('game').value.trim();   // an exact id beats a title guess
  const target=$('cur').value;
  const backend=backendUrl();
  if(!title){ setStatus('Type a game title.',false); return; }
  if(!backend){ $('status').innerHTML='Set your <b>Backend URL</b> under “Backend settings” first (see README).'; $('setBox').classList.add('open'); return; }
  store.set('ps_title',$('game').value.trim());

  busy(true); $('resultCard').style.display='none'; $('rows').innerHTML=''; $('summary').innerHTML='';

  // Escalating cold-start messaging: Render's free tier sleeps after ~15 min idle.
  clearTimers();
  setStatus('Looking up “'+title+'”…',true);
  timers.push(setTimeout(()=>setStatus('<span class="warm">Waking up the server…</span> the free host sleeps after ~15&nbsp;min idle, so the first search can take 30–45&nbsp;s.',true),4000));
  timers.push(setTimeout(()=>setStatus('<span class="warm">Still waking up…</span> this only happens on the first search after a break — later ones are quick.',true),20000));
  timers.push(setTimeout(()=>setStatus('<span class="warm">Almost there…</span> the server is awake and reading each region\'s store now.',true),45000));

  const ctrl=new AbortController();
  const stop=setTimeout(()=>ctrl.abort(),HARD_TIMEOUT);

  try{
    const res=await fetch(backend+'/prices?title='+encodeURIComponent(title),{signal:ctrl.signal});
    const body=await res.text();
    let pr;
    try{ pr=JSON.parse(body); }
    catch(e){ throw new Error('Server returned '+res.status+' (not JSON). It may still be starting up — try again in a moment.'); }
    clearTimers();
    if(pr.error){ setStatus('<span class="warm">'+pr.error+'</span>',false); busy(false); return; }

    setStatus('Converting currencies…',true);
    const fx=await getFx();
    const rate=c=>fx.rates&&fx.rates[c];
    const toTarget=(price,cur)=> (rate(cur)&&rate(target)) ? (price/rate(cur))*rate(target) : null;

    const rows=pr.results.map(x=>{
      if(x.price==null) return {r:x.region, price:null, local:'—', conv:null, red:false, foreign:false, url:null, was:null, off:null, en:x.english, langs:null};
      return {r:x.region, cur:x.currency, price:x.price, local:fmt(x.currency,x.price), conv:toTarget(x.price,x.currency), red:x.redirected, foreign:x.foreign, url:x.url,
              was:x.original!=null?fmt(x.currency,x.original):null, off:x.discount||null,
              en:x.english, langs:x.screenLanguages||x.voiceLanguages||null};
    });
    render(rows, pr.title, target);

    const ok=rows.filter(x=>x.conv!=null && !x.red).length;
    const priced=(pr.priced!=null?pr.priced:rows.filter(x=>x.conv!=null).length);
    let msg=pr.title+' — '+priced+'/'+pr.results.length+' regions';
    if(!fx.rates) msg+=' <span class="warm">· no live rates, local prices only</span>';
    else if(fx.stale) msg+=' <span class="warm">· saved rates from '+new Date(fx.ts).toLocaleDateString()+'</span>';
    setStatus(msg,false);

    $('fxline').innerHTML='store.playstation.com · '+(fx.rates?'open.er-api.com':'no FX')+' · '+new Date().toLocaleTimeString();
  }catch(e){
    clearTimers();
    const aborted=(e.name==='AbortError');
    setStatus('<span class="warm">'+(aborted
      ? 'Timed out after 2 minutes. The server may be cold or the store slow — press Find prices again.'
      : 'Couldn\'t reach the backend: '+e.message+' Check the Backend URL under “Backend settings”.')+'</span>',false);
  }finally{
    clearTimeout(stop);
    clearTimers();
    busy(false);
  }
}

function render(rows, gameName, target){
  $('convHead').textContent='≈ '+target;
  const good=rows.filter(x=>x.conv!=null && !x.red).sort((a,b)=>a.conv-b.conv);
  const redir=rows.filter(x=>x.red && x.conv!=null);
  // priced, but no FX rate to convert with — still worth showing the local price
  const noconv=rows.filter(x=>x.price!=null && x.conv==null);
  const bad=rows.filter(x=>x.price==null);
  $('resultCard').style.display='block';

  if(good.length){
    const c=good[0], sg=good.find(x=>x.r==='SG'), home=good.find(x=>x.r===target)||sg;
    $('summary').innerHTML=
      '<div class="tile"><div class="k">Cheapest</div><div class="v good">'+label(c.r)+' · '+fmt(target,c.conv)+'</div></div>'+
      (home?'<div class="tile"><div class="k">'+home.r+'</div><div class="v">'+fmt(target,home.conv)+'</div></div>':'');
  }
  let h='';
  const enBadge=x=>{
    if(x.en===true)  return '<span class="badge en" title="'+esc('English: '+((x.langs||[]).join(', ')||'yes'))+'">EN</span>';
    if(x.en===false) return '<span class="badge noen" title="'+esc('No English. Languages: '+((x.langs||[]).join(', ')||'unknown'))+'">NO EN</span>';
    return '';   // null = the store page said nothing; do not claim either way
  };
  const cell=x=>'<td><span class="reg" title="'+esc((REGION_NAME[x.r]||x.r)+' · '+x.r)+'">'+flag(x.r)+'<b>'+esc(x.cur||x.r)+'</b></span>'+enBadge(x);
  good.forEach((x,i)=>{ h+='<tr class="'+(i===0?'best':'')+'"><td><span class="rank">'+(i+1)+'</span></td>'+cell(x)+(i===0?'<span class="badge best">CHEAPEST</span>':'')+'</td><td class="num">'+priceCell(x)+'</td><td class="num conv">'+fmt(target,x.conv)+'</td></tr>'; });
  redir.forEach(x=>{ h+='<tr><td><span class="rank">–</span></td>'+cell(x)+'<span class="badge warn">'+esc(x.r)+'</span></td><td class="num">'+priceCell(x)+'</td><td class="num conv">'+fmt(target,x.conv)+'</td></tr>'; });
  noconv.forEach(x=>{ h+='<tr><td><span class="rank">–</span></td>'+cell(x)+'</td><td class="num">'+priceCell(x)+'</td><td class="num" style="color:var(--dim)">no rate</td></tr>'; });
  bad.forEach(x=>{ h+='<tr><td><span class="rank">–</span></td>'+cell(x)+'</td><td class="num" colspan="2" style="color:var(--warn)">not available</td></tr>'; });
  $('rows').innerHTML=h;

  // Unranked rows are easy to misread as "missing", so say what they are.
  const n=[];
  const foreignRanked=good.filter(x=>x.foreign);
  if(foreignRanked.length) n.push(foreignRanked.map(x=>x.r+' lists in '+x.cur).join(', ')+' — still ranked.');
  if(redir.length) n.push(redir.map(x=>x.r).join(', ')+' priced in '+[...new Set(redir.map(x=>x.cur))].join('/')+' — excluded from the ranking.');
  if(noconv.length) n.push(noconv.length+' region(s) have no FX rate.');
  if(bad.length) n.push(bad.map(x=>x.r).join(', ')+' — no price found.');
  $('note').innerHTML=n.join('<br>');
}

$('go').addEventListener('click',run);
$('game').addEventListener('keydown',e=>{
  if(sugItems.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    sugIdx=(sugIdx+(e.key==='ArrowDown'?1:-1)+sugItems.length)%sugItems.length;
    [...$('sug').children].forEach((c,i)=>c.classList.toggle('sel',i===sugIdx));
    return;
  }
  if(e.key==='Escape') return hideSug();
  if(e.key==='Enter'){ if(sugIdx>=0) return pick(sugIdx); hideSug(); run(); }
});
loadCatalog();   // warm the index while the user is still reading the page
</script>
</body>
</html>
