name: Update game catalogue

# Rebuilds catalog.json daily and commits it when anything changed, so the git
# history reads as a log of which games appeared.
#
# A full walk is used rather than an incremental one: the category is ordered by
# popularity, not by release date, and the API exposes no release date on this
# query — so a new but unpopular title would not appear near the front and an
# incremental run would miss it. A full walk is 100 requests and about two
# minutes, which is cheap enough not to trade correctness for.

on:
  schedule:
    - cron: '17 5 * * *'          # 05:17 UTC daily (off the hour: less contended)
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Incremental instead of a full walk (faster, can miss unpopular new titles)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect
        run: |
          if [ "${{ inputs.incremental }}" = "true" ]; then
            node catalog.js --update --out catalog.json
          else
            node catalog.js --all --out catalog.json
          fi

      - name: Commit if anything changed
        run: |
          # `git add` first: catalog.json is untracked on the very first run, and
          # `git diff` alone does not see untracked files — which silently threw
          # away the first full collection.
          git add catalog.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          read -r ins del _ <<< "$(git diff --cached --numstat -- catalog.json)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game catalogue (+${ins:-0} / -${del:-0})"
          git push
