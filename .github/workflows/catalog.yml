name: Update game catalogue

# Two schedules, because they answer different questions:
#
#   Daily   --new  filters conceptReleaseDate:last_thirty_days, so it costs a
#                  couple of requests and is driven by real release dates.
#   Weekly  --all  walks every price band and unions them, which reaches the
#                  whole catalogue (~12,900) rather than the 10,000 the API
#                  will serve from a single unfiltered walk. This also catches
#                  back-catalogue titles added to the store long after release,
#                  which a last-30-days filter cannot see.
#
# Either way the commit is only made when catalog.json actually changed, so the
# history reads as a log of what appeared.

on:
  schedule:
    - cron: '17 5 * * 1-6'        # Mon-Sat: new releases only
    - cron: '47 4 * * 0'          # Sunday: full rebuild
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which collection to run'
        type: choice
        options: [new, all]
        default: all

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Choose mode
        id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then
            echo "flag=--${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "flag=--all" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--new" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        run: node catalog.js ${{ steps.mode.outputs.flag }} --out catalog.json

      # One concept page per game, so the first pass is ~12,700 fetches. Chunked
      # at 2,000 a run it backfills in under a week without a marathon job, and
      # once done costs only the handful of games added since -- the pass only
      # touches rows that have no date.
      - name: Backfill release dates
        continue-on-error: true
        run: node catalog.js --dates --limit 2000 --pool 4 --out catalog.json

      # Fails open by design: an unrecognised classification counts as a game, so
      # a new add-on label produces a wrong price silently. Sampling for unknown
      # values turns that into a visible report. Non-blocking -- the catalogue
      # update should still commit.
      - name: Look for unknown store classifications
        if: steps.mode.outputs.flag == '--all'
        continue-on-error: true
        run: node catalog.js --classes --classes-sample 40

      - name: Commit if anything changed
        run: |
          # Stage first: catalog.json is untracked on the very first run, and
          # `git diff` alone does not see untracked files — which silently threw
          # away the first full collection.
          git add catalog.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          read -r ins del _ <<< "$(git diff --cached --numstat -- catalog.json)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game catalogue (+${ins:-0} / -${del:-0})"
          git push
